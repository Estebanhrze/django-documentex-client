{% extends 'base.html' %}
{% block heading %}Nueva versión{% endblock %}
{% block content %}<section class="panel form-panel"><h2>{{ document.title }}</h2><p class="muted">Carga un archivo para crear la siguiente versión.</p><form method="post" enctype="multipart/form-data">{% csrf_token %}{{ form.as_div }}<div class="form-actions"><a href="{{ document.get_absolute_url }}">Cancelar</a><button class="button" type="submit">Guardar versión</button></div></form></section>{% endblock %}
